<!DOCTYPE html>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        menu: {
                            bg: '#171a2a', // メニューのメイン背景色
                            item: '#262b40', // メニュー項目の背景色

    <style>
        /* 全体のレイアウト設定 */
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden; /* 全体のスクロールを防ぎ、内部でスクロールさせる */
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* ツールバーのスクロールバーを隠す */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* アコーディオンのアニメーション用CSS */
        .accordion-content {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s ease-in-out;
        }
        .accordion-content.open {
            grid-template-rows: 1fr;
        }
        .accordion-inner {
            overflow: hidden;
        }
        
        /* 矢印アイコンの回転アニメーション */
        .arrow-icon {
            transition: transform 0.3s ease;
        }
        .arrow-icon.open {
            transform: rotate(180deg);
        }

        /* サイドバーのアニメーション */
        #sidebar {
            transition: transform 0.3s ease-in-out;
        }
        
        /* メッセージトーストのアニメーション */
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, 20px); }
            10% { opacity: 1; transform: translate(-50%, 0); }
            90% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -20px); }
        }
        .toast-animate {
            animation: fadeInOut 2.5s ease-in-out forwards;
        }
    </style>
</head>

    <script>
        // DOM要素の取得
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('menu-overlay');
        const accordionContent = document.getElementById('accordion-content');
        const accordionArrow = document.getElementById('accordion-arrow');

        // Marked.js の設定 (改行を<br>に変換するなど)
        marked.use({
            breaks: true,
            gfm: true
        });

        // リアルタイムプレビュー機能
        function updatePreview() {
            const markdownText = editor.value;
            // MarkdownをHTMLに変換してプレビュー領域に挿入
            preview.innerHTML = marked.parse(markdownText);
        }

        // 入力イベントリスナーの設定
        editor.addEventListener('input', updatePreview);
        
        // サンプルテキストの定義と初期設定
        const defaultSample = `# Markdown エディタへようこそ！

ここはMarkdownをリアルタイムでプレビューできるエディタです。
上部のツールバーから簡単にMarkdown記号を挿入できます。

## 基本的な書式

* **太字**
* *斜体*
* ~~取り消し線~~

### リスト

1. 番号付きリスト 1
2. 番号付きリスト 2
   - 入れ子のリスト
   - アイテム

### リンクと画像

[Google](https://www.google.com)

![プレースホルダー画像](https://placehold.co/150x100/e2e8f0/475569?text=Sample)

### 引用

> これは引用です。
> 複数行にまたがることもできます。

### コード

インラインコード: \`console.log('Hello World!');\`

コードブロック:
\`\`\`javascript
function greet(name) {
  return \`Hello, \${name}!\`;
}
\`\`\`

### テーブル

| 左寄せ | 中央寄せ | 右寄せ |
| :--- | :---: | ---: |
| セル1 | セル2 | セル3 |
| セル4 | セル5 | セル6 |

### タスクリスト
- [x] 完了したタスク
- [ ] 未完了のタスク
`;
        
        editor.value = defaultSample;

        // 初期状態の表示
        updatePreview();

        // -----------------------------
        // ツールバーの挿入機能
        // -----------------------------
        function insertMarkdown(type) {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const selectedText = editor.value.substring(start, end);
            let before = '';
            let after = '';
            let defaultText = '';
            
            switch(type) {
                case 'bold': before = '**'; after = '**'; defaultText = '太字'; break;
                case 'italic': before = '*'; after = '*'; defaultText = '斜体'; break;
                case 'strike': before = '~~'; after = '~~'; defaultText = '打ち消し線'; break;
                case 'heading': before = '# '; after = ''; defaultText = '見出し'; break;
                case 'quote': before = '> '; after = ''; defaultText = '引用'; break;
                case 'code': 
                    if (selectedText.includes('\n') || !selectedText) {
                        before = '\n```\n'; after = '\n```\n'; defaultText = 'code';
                    } else {
                        before = '`'; after = '`'; defaultText = 'code';
                    }
                    break;
                case 'link': before = '['; after = '](url)'; defaultText = 'リンクテキスト'; break;
                case 'image': before = '!['; after = '](image-url)'; defaultText = '代替テキスト'; break;
                case 'ul': before = '- '; after = ''; defaultText = 'リストアイテム'; break;
                case 'ol': before = '1. '; after = ''; defaultText = 'リストアイテム'; break;
                case 'check': before = '- [ ] '; after = ''; defaultText = 'タスク'; break;
                case 'hr': before = '\n---\n\n'; after = ''; break;
                case 'table': before = '\n| 見出し | 見出し |\n| --- | --- |\n| セル | セル |\n'; after = ''; break;
            }

            const insertText = selectedText || defaultText;
            const newText = before + insertText + after;
            
            // テキストの挿入
            editor.setRangeText(newText, start, end, 'select');
            
            // カーソル位置の調整
            if (!selectedText && defaultText) {
                editor.selectionStart = start + before.length;
                editor.selectionEnd = start + before.length + insertText.length;
            } else if (!selectedText && !defaultText) {
                editor.selectionStart = editor.selectionEnd = start + newText.length;
            }
            
            editor.focus();
            updatePreview();
        }

        // -----------------------------
        // メニューの開閉機能
        // -----------------------------
        let isMenuOpen = false;

        function toggleMenu() {
            isMenuOpen = !isMenuOpen;
            if (isMenuOpen) {
                // 開く処理
                overlay.classList.remove('hidden');
                // 少し遅延させてopacityを変更しフェードインさせる
                setTimeout(() => { overlay.classList.remove('opacity-0'); }, 10);
                sidebar.classList.remove('translate-x-full');
            } else {
                // 閉じる処理
                overlay.classList.add('opacity-0');
                sidebar.classList.add('translate-x-full');
                // トランジション終了後に非表示にする
                setTimeout(() => { overlay.classList.add('hidden'); }, 300);
            }
        }

        // -----------------------------
        // アコーディオンの開閉機能
        // -----------------------------
        // 初期状態は開いておくように設定（画像に基づき）
        let isAccordionOpen = true;
        
        // 初期状態で開いておく
        if (isAccordionOpen) {
            accordionContent.classList.add('open');
            accordionArrow.classList.add('open');
        }

        function toggleAccordion() {
            isAccordionOpen = !isAccordionOpen;
            if (isAccordionOpen) {
                accordionContent.classList.add('open');
                accordionArrow.classList.add('open');
            } else {
                accordionContent.classList.remove('open');
                accordionArrow.classList.remove('open');
            }
        }

        // -----------------------------
        // トースト通知機能 (alertの代わり)
        // -----------------------------
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgColor = type === 'success' ? 'bg-green-600' : 'bg-red-600';
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-circle-exclamation';

            toast.className = `${bgColor} text-white px-4 py-3 rounded shadow-lg flex items-center gap-2 font-bold text-sm toast-animate absolute w-max`;
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> ${message}`;
            
            container.appendChild(toast);
            
            // アニメーション終了後に要素を削除
            setTimeout(() => {
                toast.remove();
            }, 2500);
        }

        // -----------------------------
        // HTMLコピー機能
        // -----------------------------
        function copyHtml() {
            const markdownText = editor.value;
            if (!markdownText.trim()) {
                showToast("コピーする内容がありません", "error");
                return;
            }

            const htmlContent = marked.parse(markdownText);

            // クリップボードAPIを使用してコピー
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(htmlContent).then(() => {
                    showToast("HTMLコードをコピーしました！");
                }).catch(err => {
                    console.error('Copy failed: ', err);
                    fallbackCopyTextToClipboard(htmlContent);
                });
            } else {
                fallbackCopyTextToClipboard(htmlContent);
            }
        }

        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            // 画面外に配置
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast("HTMLコードをコピーしました！");
                } else {
                    showToast("コピーに失敗しました", "error");
                }
            } catch (err) {
                showToast("コピーに失敗しました", "error");
            }
            document.body.removeChild(textArea);
        }

        // -----------------------------
        // HTML保存機能
        // -----------------------------
        function downloadHtml() {
            const markdownText = editor.value;
            if (!markdownText.trim()) {
                showToast("保存する内容がありません", "error");
                return;
            }

            const parsedHtml = marked.parse(markdownText);
            
            // 保存用の完全なHTMLドキュメントを作成
            // Tailwind Typography風のスタイルをインラインで少し当てて見やすくします
            const fullHtmlContent = `<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

            // Blobを作成してダウンロードリンクを生成
            const blob = new Blob([fullHtmlContent], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'markdown-export.html'; // デフォルトのファイル名
            
            document.body.appendChild(a);
            a.click();
            
            // 後処理
            setTimeout(() => {
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            }, 0);
            
            showToast("HTMLファイルを保存しました！");
        }
    </script>
</body>
</html>
