  <!-- JavaScript Implementation -->
  <script>
    // --- Menu Drawer Interactivity ---
    function toggleMenu() {
      const backdrop = document.getElementById('menu-backdrop');
      const drawer = document.getElementById('menu-drawer');
      
      const isHidden = backdrop.classList.contains('hidden-menu');
      if (isHidden) {
        backdrop.classList.remove('hidden-menu');
        drawer.classList.remove('closed-drawer');
      } else {
        backdrop.classList.add('hidden-menu');
        drawer.classList.add('closed-drawer');
      }
    }

    // --- Accordion Interactivity ---
    function toggleAccordion() {
      const body = document.getElementById('accordion-body');
      const arrow = document.getElementById('accordion-arrow');
      
      const isOpen = body.classList.contains('is-open');
      if (isOpen) {
        body.classList.remove('is-open');
        arrow.classList.remove('rotate-180');
      } else {
        body.classList.add('is-open');
        arrow.classList.add('rotate-180');
      }
    }

    // --- Password Generator Logic ---
    const canvasPass = document.getElementById('canvas-password');
    const ctxPass = canvasPass.getContext('2d');

    function showToast(text) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = text;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2500);
    }

    function generatePassword() {
      const length = parseInt(document.getElementById('pass-length').value);
      document.getElementById('pass-length-val').innerText = length;

      const useUpper = document.getElementById('pass-uppercase').checked;
      const useLower = document.getElementById('pass-lowercase').checked;
      const useNumbers = document.getElementById('pass-numbers').checked;
      const useSymbols = document.getElementById('pass-symbols').checked;

      const upperChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const lowerChars = "abcdefghijklmnopqrstuvwxyz";
      const numberChars = "0123456789";
      const symbolChars = "!@#$%^&*()_+-=[]{}|;:,.<>?";

      let availableChars = "";
      if (useUpper) availableChars += upperChars;
      if (useLower) availableChars += lowerChars;
      if (useNumbers) availableChars += numberChars;
      if (useSymbols) availableChars += symbolChars;

      if (!availableChars) {
        document.getElementById('pass-output').value = "オプションを選択してください";
        drawPasswordGauge(0);
        return;
      }

      let generated = "";
      for (let i = 0; i < length; i++) {
        const randIdx = Math.floor(Math.random() * availableChars.length);
        generated += availableChars[randIdx];
      }

      document.getElementById('pass-output').value = generated;

      let score = 0;
      if (length >= 8) score += 1;
      if (length >= 14) score += 1;
      if (useUpper && useLower) score += 1;
      if (useNumbers) score += 1;
      if (useSymbols) score += 1;

      drawPasswordGauge(score);
    }

    function drawPasswordGauge(score) {
      const w = canvasPass.width;
      const h = canvasPass.height;
      const cx = w / 2;
      const cy = h / 2 + 30;
      const radius = 75;

      ctxPass.clearRect(0, 0, w, h);

      ctxPass.save();
      ctxPass.translate(cx, cy);

      ctxPass.beginPath();
      ctxPass.arc(0, 0, radius, Math.PI, 2 * Math.PI);
      ctxPass.strokeStyle = '#1e293b';
      ctxPass.lineWidth = 14;
      ctxPass.stroke();

      const maxScore = 5;
      const pct = Math.min(1, score / maxScore);
      const endAngle = Math.PI + (Math.PI * pct);

      let color = '#ef4444';
      let labelStr = '脆弱 (Weak)';
      if (score >= 2) { color = '#f59e0b'; labelStr = '普通 (Medium)'; }
      if (score >= 4) { color = '#10b981'; labelStr = '強固 (Strong)'; }
      if (score >= 5) { color = '#38bdf8'; labelStr = '極めて安全 (Very Safe)'; }

      ctxPass.beginPath();
      ctxPass.arc(0, 0, radius, Math.PI, endAngle);
      ctxPass.strokeStyle = color;
      ctxPass.lineWidth = 14;
      ctxPass.lineCap = 'round';
      ctxPass.stroke();

      ctxPass.fillStyle = color;
      ctxPass.font = 'bold 24px "Inter", sans-serif';
      ctxPass.textAlign = 'center';
      ctxPass.fillText(`${Math.round(pct * 100)}%`, 0, -20);

      ctxPass.restore();

      const labelElem = document.getElementById('pass-strength-label');
      labelElem.innerText = labelStr;
      labelElem.style.color = color;
    }

    function copyPassword() {
      const passField = document.getElementById('pass-output');
      if (passField.value && passField.value !== "オプションを選択してください") {
        passField.select();
        document.execCommand('copy');
        showToast("パスワードをコピーしました！");
      }
    }

    window.onload = function() {
      generatePassword();
    };
  </script>
