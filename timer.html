                <span id="timer-status-badge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700">停止中</span>
              </h3>
              
              <!-- Input fields with real-time update listeners -->

                <div>
                  <label class="block text-xs font-semibold text-slate-400 mb-1">時間</label>
                  <input type="number" id="timer-hours" min="0" max="99" value="0" oninput="onTimerInputChanged()" class="timer-input w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-center font-mono text-lg text-white focus:outline-none focus:border-sky-500 disabled:opacity-40 disabled:cursor-not-allowed">
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-400 mb-1">分</label>
                  <input type="number" id="timer-minutes" min="0" max="59" value="3" oninput="onTimerInputChanged()" class="timer-input w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-center font-mono text-lg text-white focus:outline-none focus:border-sky-500 disabled:opacity-40 disabled:cursor-not-allowed">
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-400 mb-1">秒</label>
                  <input type="number" id="timer-seconds" min="0" max="59" value="0" oninput="onTimerInputChanged()" class="timer-input w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-center font-mono text-lg text-white focus:outline-none focus:border-sky-500 disabled:opacity-40 disabled:cursor-not-allowed">
                </div>
              </div>

              <!-- Quick Presets -->
              <div class="flex flex-wrap gap-2">
                <button onclick="addTimerSeconds(10)" class="btn-quick-add px-3 py-1.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed text-xs font-semibold text-slate-300 rounded-lg border border-slate-700 transition">+10秒</button>
                <button onclick="addTimerSeconds(60)" class="btn-quick-add px-3 py-1.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed text-xs font-semibold text-slate-300 rounded-lg border border-slate-700 transition">+1分</button>
                <button onclick="addTimerSeconds(300)" class="btn-quick-add px-3 py-1.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed text-xs font-semibold text-slate-300 rounded-lg border border-slate-700 transition">+5分</button>
                <button onclick="addTimerSeconds(600)" class="btn-quick-add px-3 py-1.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed text-xs font-semibold text-slate-300 rounded-lg border border-slate-700 transition">+10分</button>

              <div class="flex gap-3 pt-2">

                  スタート
                </button>

                  ラップ

  <!-- Toast Popup -->

  <!-- JS Implementation -->
  <script>
    // Drawer Menu Logic
    function openMenu() {
      const overlay = document.getElementById('menu-overlay');
      const drawer = document.getElementById('menu-drawer');
      overlay.classList.remove('opacity-0', 'pointer-events-none');
      drawer.classList.remove('translate-x-full');
    }

    function closeMenu() {
      const overlay = document.getElementById('menu-overlay');
      const drawer = document.getElementById('menu-drawer');
      overlay.classList.add('opacity-0', 'pointer-events-none');
      drawer.classList.add('translate-x-full');
    }

    // Tools Accordion Toggle Logic
    let isToolsOpen = true;
    function toggleToolsAccordion() {
      const content = document.getElementById('tools-accordion-content');
      const arrow = document.getElementById('accordion-arrow');
      
      if (isToolsOpen) {
        content.style.maxHeight = '0px';
        arrow.classList.remove('rotate-180');
        isToolsOpen = false;
      } else {
        content.style.maxHeight = content.scrollHeight + 'px';
        arrow.classList.add('rotate-180');
        isToolsOpen = true;
      }
    }

    // Timer & Stopwatch Logic
    const canvasClock = document.getElementById('canvas-clock');
    const ctxClock = canvasClock.getContext('2d');

    let activeTimerMode = 'timer'; // 'timer' | 'stopwatch'
    
    // Timer Variables
    let timerTotalSeconds = 180;
    let timerRemainingSeconds = 180;
    let timerInterval = null;
    let isTimerRunning = false;
    let isTimerPaused = false;

    // Stopwatch Variables
    let swStartTime = 0;
    let swElapsedTime = 0;
    let swInterval = null;
    let isSwRunning = false;
    let swLaps = [];

    function showToast(text) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = text;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2500);
    }

    function toggleTimerSub(mode) {
      activeTimerMode = mode;
      document.getElementById('sub-timer-view').classList.toggle('hidden', mode !== 'timer');
      document.getElementById('sub-stopwatch-view').classList.toggle('hidden', mode !== 'stopwatch');

      const btnTimer = document.getElementById('btn-mode-timer');
      const btnSw = document.getElementById('btn-mode-stopwatch');

      if (mode === 'timer') {
        btnTimer.className = "px-6 py-2.5 rounded-xl font-bold text-sm transition bg-sky-500 text-white shadow-md";
        btnSw.className = "px-6 py-2.5 rounded-xl font-bold text-sm transition text-slate-400 hover:text-white";
      } else {
        btnSw.className = "px-6 py-2.5 rounded-xl font-bold text-sm transition bg-sky-500 text-white shadow-md";
        btnTimer.className = "px-6 py-2.5 rounded-xl font-bold text-sm transition text-slate-400 hover:text-white";
      }
      drawClockCanvas();
    }

    function setTimerInputsDisabled(disabled) {
      document.getElementById('timer-hours').disabled = disabled;
      document.getElementById('timer-minutes').disabled = disabled;
      document.getElementById('timer-seconds').disabled = disabled;

      document.querySelectorAll('.btn-quick-add').forEach(btn => {
        btn.disabled = disabled;
      });
    }

    function onTimerInputChanged() {
      if (isTimerRunning || isTimerPaused) return;

      const h = parseInt(document.getElementById('timer-hours').value) || 0;
      const m = parseInt(document.getElementById('timer-minutes').value) || 0;
      const s = parseInt(document.getElementById('timer-seconds').value) || 0;

      timerTotalSeconds = h * 3600 + m * 60 + s;
      timerRemainingSeconds = timerTotalSeconds;
      drawClockCanvas();
    }

    function addTimerSeconds(sec) {
      if (isTimerRunning || isTimerPaused) return;

      const h = parseInt(document.getElementById('timer-hours').value) || 0;
      const m = parseInt(document.getElementById('timer-minutes').value) || 0;
      const s = parseInt(document.getElementById('timer-seconds').value) || 0;

      let currentTotal = h * 3600 + m * 60 + s + sec;
      
      document.getElementById('timer-hours').value = Math.floor(currentTotal / 3600);
      document.getElementById('timer-minutes').value = Math.floor((currentTotal % 3600) / 60);
      document.getElementById('timer-seconds').value = currentTotal % 60;
      
      onTimerInputChanged();
    }

    function drawClockCanvas() {
      const w = canvasClock.width;
      const h = canvasClock.height;
      const cx = w / 2;
      const cy = h / 2;
      const radius = 120;

      ctxClock.clearRect(0, 0, w, h);

      ctxClock.save();
      ctxClock.translate(cx, cy);
      ctxClock.beginPath();
      ctxClock.arc(0, 0, radius, 0, Math.PI * 2);
      ctxClock.strokeStyle = '#1e293b';
      ctxClock.lineWidth = 16;
      ctxClock.stroke();

      if (activeTimerMode === 'timer') {
        const pct = timerTotalSeconds > 0 ? timerRemainingSeconds / timerTotalSeconds : 0;
        const startAngle = -Math.PI / 2;
        const endAngle = startAngle + (Math.PI * 2 * pct);

        ctxClock.beginPath();
        ctxClock.arc(0, 0, radius, startAngle, endAngle);
        ctxClock.strokeStyle = '#38bdf8';
        ctxClock.lineWidth = 16;
        ctxClock.lineCap = 'round';
        ctxClock.stroke();

        const hVal = Math.floor(timerRemainingSeconds / 3600);
        const mVal = Math.floor((timerRemainingSeconds % 3600) / 60);
        const sVal = timerRemainingSeconds % 60;

        const timeStr = hVal > 0 
          ? `${String(hVal).padStart(2, '0')}:${String(mVal).padStart(2, '0')}:${String(sVal).padStart(2, '0')}`
          : `${String(mVal).padStart(2, '0')}:${String(sVal).padStart(2, '0')}`;

        ctxClock.fillStyle = '#f8fafc';
        ctxClock.font = 'bold 36px "Inter", sans-serif';
        ctxClock.textAlign = 'center';
        ctxClock.textBaseline = 'middle';
        ctxClock.fillText(timeStr, 0, 0);

        ctxClock.font = '12px "Noto Sans JP", sans-serif';
        ctxClock.fillStyle = '#94a3b8';
        ctxClock.fillText('タイマー', 0, 45);

      } else {
        const seconds = (swElapsedTime / 1000) % 60;
        const startAngle = -Math.PI / 2;
        const endAngle = startAngle + (Math.PI * 2 * (seconds / 60));

        ctxClock.beginPath();
        ctxClock.arc(0, 0, radius, startAngle, endAngle);
        ctxClock.strokeStyle = '#10b981';
        ctxClock.lineWidth = 16;
        ctxClock.lineCap = 'round';
        ctxClock.stroke();

        const ms = Math.floor((swElapsedTime % 1000) / 10);
        const totalSec = Math.floor(swElapsedTime / 1000);
        const mins = Math.floor(totalSec / 60);
        const secs = totalSec % 60;

        const timeStr = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${String(ms).padStart(2, '0')}`;

        ctxClock.fillStyle = '#f8fafc';
        ctxClock.font = 'bold 34px "Inter", sans-serif';
        ctxClock.textAlign = 'center';
        ctxClock.textBaseline = 'middle';
        ctxClock.fillText(timeStr, 0, 0);

        ctxClock.font = '12px "Noto Sans JP", sans-serif';
        ctxClock.fillStyle = '#94a3b8';
        ctxClock.fillText('ストップウォッチ', 0, 45);
      }

      ctxClock.restore();
    }

    function startTimer() {
      if (isTimerRunning) return;

      if (!isTimerPaused) {
        onTimerInputChanged();
      }

      if (timerRemainingSeconds <= 0) return;

      isTimerRunning = true;
      isTimerPaused = false;

      setTimerInputsDisabled(true);

      document.getElementById('btn-timer-start').disabled = true;
      document.getElementById('btn-timer-pause').disabled = false;
      document.getElementById('timer-status-badge').innerText = "計測中";
      document.getElementById('timer-status-badge').className = "text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30";

      timerInterval = setInterval(() => {
        timerRemainingSeconds--;
        drawClockCanvas();

        if (timerRemainingSeconds <= 0) {
          clearInterval(timerInterval);
          isTimerRunning = false;
          isTimerPaused = false;

          setTimerInputsDisabled(false);

          document.getElementById('btn-timer-start').disabled = false;
          document.getElementById('btn-timer-pause').disabled = true;
          document.getElementById('timer-status-badge').innerText = "時間切れ";
          document.getElementById('timer-status-badge').className = "text-xs font-semibold px-2.5 py-1 rounded-full bg-red-500/10 text-red-400 border border-red-500/30";
          
          showToast("⏱️ タイマーの時間になりました！");
        }
      }, 1000);
    }

    function pauseTimer() {
      if (!isTimerRunning) return;
      clearInterval(timerInterval);
      isTimerRunning = false;
      isTimerPaused = true;

      setTimerInputsDisabled(true);

      document.getElementById('btn-timer-start').disabled = false;
      document.getElementById('btn-timer-pause').disabled = true;
      document.getElementById('timer-status-badge').innerText = "一時停止";
      document.getElementById('timer-status-badge').className = "text-xs font-semibold px-2.5 py-1 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/30";
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isTimerRunning = false;
      isTimerPaused = false;

      setTimerInputsDisabled(false);

      document.getElementById('btn-timer-start').disabled = false;
      document.getElementById('btn-timer-pause').disabled = true;
      document.getElementById('timer-status-badge').innerText = "停止中";
      document.getElementById('timer-status-badge').className = "text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700";

      onTimerInputChanged();
    }

    function startStopwatch() {
      if (isSwRunning) {
        clearInterval(swInterval);
        isSwRunning = false;
        document.getElementById('btn-sw-start').innerText = '再開';
        document.getElementById('btn-sw-start').className = "flex-1 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/20 transition";
        document.getElementById('btn-sw-lap').disabled = true;
      } else {
        isSwRunning = true;
        swStartTime = Date.now() - swElapsedTime;
        document.getElementById('btn-sw-start').innerText = '一時停止';
        document.getElementById('btn-sw-start').className = "flex-1 py-3 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl shadow-lg shadow-amber-600/20 transition";
        document.getElementById('btn-sw-lap').disabled = false;

        swInterval = setInterval(() => {
          swElapsedTime = Date.now() - swStartTime;
          drawClockCanvas();
        }, 30);
      }
    }

    function lapStopwatch() {
      if (!isSwRunning) return;
      const ms = Math.floor((swElapsedTime % 1000) / 10);
      const totalSec = Math.floor(swElapsedTime / 1000);
      const mins = Math.floor(totalSec / 60);
      const secs = totalSec % 60;
      const timeFormatted = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${String(ms).padStart(2, '0')}`;

      swLaps.unshift(timeFormatted);

      const list = document.getElementById('sw-lap-list');
      list.innerHTML = swLaps.map((lap, idx) => `
        <li class="py-1.5 px-2 bg-slate-800/50 rounded-lg flex justify-between border border-slate-700/40">
          <span class="text-slate-400">Lap ${swLaps.length - idx}</span>
          <span class="font-bold text-sky-400">${lap}</span>
        </li>
      `).join('');
    }

    function resetStopwatch() {
      clearInterval(swInterval);
      isSwRunning = false;
      swElapsedTime = 0;
      swLaps = [];
      document.getElementById('btn-sw-start').innerText = 'スタート';
      document.getElementById('btn-sw-start').className = "flex-1 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/20 transition";
      document.getElementById('btn-sw-lap').disabled = true;
      document.getElementById('sw-lap-list').innerHTML = '<li class="text-center text-slate-500 py-3">ラップタイム記録はありません</li>';
      drawClockCanvas();
    }

    window.onload = function() {
      onTimerInputChanged();
      // Initialize accordion height for initial state
      const content = document.getElementById('tools-accordion-content');
      if (content) {
        content.style.maxHeight = content.scrollHeight + 'px';
      }
    };
  </script>
</body>
</html>
